name: bluetooth_hopping_app
description: Flutter app for Bluetooth data hopping between devices

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  
  # UI & State Management
  cupertino_icons: ^1.0.2
  flutter_blue_plus: ^1.32.0
  provider: ^6.1.1
  
  # Image & File Handling
  image_picker: ^1.0.7
  path_provider: ^2.1.1
  image: ^4.1.7
  
  # Bluetooth & Nearby Connections
  nearby_connections: ^4.3.0
  
  # Local Storage
  sqflite: ^2.3.0
  shared_preferences: ^2.2.2
  path: ^1.8.3
  
  # Permissions
  permission_handler: ^11.3.0
  
  # UUID Generation
  uuid: ^4.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true